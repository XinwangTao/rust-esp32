[package]
name = "tarot_core"
version = "0.8.0"
authors = ["Admin"]
description = "ESP32-S3 INMP441 UDP audio transmitter core"
edition = "2021"

[lib]
name = "tarot_core"
crate-type = ["staticlib"]

[dependencies]
esp-idf-svc = { version = "0.50", default-features = false, features = ["critical-section", "std", "alloc", "experimental"] }
esp-idf-hal = { version = "0.45", default-features = false }
anyhow = "1.0"
log = "0.4"
esp-idf-sys = { version = "0.36", default-features = false, features = ["std", "native"] }
embedded-svc = "0.28"

[package.metadata.esp-idf-sys]
esp_idf_tools_install_dir = "from_env"
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults", "sdkconfig.defaults.esp32s3"]

[profile.dev]
panic = "unwind"

[profile.release]
panic = "abort"
